name: Sinkronisasi Pengaturan Semua Halaman

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "pages/**/*.html"
      - "scripts/settings.js"
      - "scripts/sync-page-settings.mjs"
      - "styles/**/*.css"
      - ".github/workflows/sync-page-settings.yml"

permissions:
  contents: write

jobs:
  sync-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sinkronkan pengaturan halaman
        run: node scripts/sync-page-settings.mjs

      - name: Periksa perubahan
        run: |
          git diff --stat
          git diff --check

      - name: Commit perubahan
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sinkronkan tema dan pengaturan semua halaman"
